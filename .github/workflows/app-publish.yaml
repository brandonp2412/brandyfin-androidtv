name: App / Publish

on:
  release:
    types:
      - created
      - edited
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-24.04
    if: ${{ contains(github.repository_owner, 'jellyfin') }}
    permissions:
      contents: write
    steps:
      - name: Set JELLYFIN_VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "JELLYFIN_VERSION=$(printf '%s' "$RELEASE_TAG" | sed 's#^v##' | tr / -)" >> "$GITHUB_ENV"

      - name: Check release assets
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')" -eq 0 ]; then
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Decode keystore
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > keystore.jks

      - name: Assemble release files
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemble bundleRelease versionTxt

      - name: Prepare release archive
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        run: |
          mkdir -p build/jellyfin-publish
          mv app/build/outputs/apk/debug/jellyfin-androidtv-*-debug.apk build/jellyfin-publish/
          mv app/build/outputs/apk/release/jellyfin-androidtv-*-release.apk build/jellyfin-publish/
          mv app/build/outputs/bundle/release/jellyfin-androidtv-*-release.aab build/jellyfin-publish/
          mv app/build/version.txt build/jellyfin-publish/

      - name: Upload release archive to GitHub release
        if: ${{ steps.release-assets.outputs.has_assets == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" --repo "$REPO" build/jellyfin-publish/* --clobber

      - name: Download release archive
        if: ${{ github.event.action == 'published' && steps.release-assets.outputs.has_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p build/jellyfin-publish
          gh release download "$RELEASE_TAG" --repo "$REPO" --dir build/jellyfin-publish

      - name: Configure deployment
        if: ${{ github.event.action == 'published' }}
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$REPO_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Upload release archive to repo.jellyfin.org
        if: ${{ github.event.action == 'published' }}
        env:
          TARGET_PATH: /srv/incoming/androidtv/v${{ env.JELLYFIN_VERSION }}/
          SOURCE_PATH: build/jellyfin-publish/
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_HOST: ${{ secrets.REPO_HOST }}
        run: rsync -vrptz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" "$SOURCE_PATH" "${REPO_USER}@${REPO_HOST}:$TARGET_PATH"

      - name: Update repo.jellyfin.org symlinks
        if: ${{ github.event.action == 'published' }}
        env:
          REPO_HOST: ${{ secrets.REPO_HOST }}
          REPO_USER: ${{ secrets.REPO_USER }}
          JELLYFIN_VERSION: ${{ env.JELLYFIN_VERSION }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "${REPO_USER}@${REPO_HOST}" "bash -s" <<EOF
            if [ -d "/srv/repository/main/client/androidtv/versions/v${JELLYFIN_VERSION}" ] && [ -n "${JELLYFIN_VERSION}" ]; then
                sudo rm -r /srv/repository/main/client/androidtv/versions/v${JELLYFIN_VERSION}
            fi
            sudo mv /srv/incoming/androidtv/v${JELLYFIN_VERSION} /srv/repository/main/client/androidtv/versions/v${JELLYFIN_VERSION}
            cd /srv/repository/main/client/androidtv
            sudo rm -rf *.apk version.txt
            sudo ln -s versions/v${JELLYFIN_VERSION}/jellyfin-androidtv-v${JELLYFIN_VERSION}-*.apk .
            sudo ln -s versions/v${JELLYFIN_VERSION}/version.txt .
          EOF
